    <script type="text/javascript">
            $(function(){
                if (jsBridge ) {
                    setTimeout(function(){
                        jsBridge.callAppRouter("phoneInfo", "", function (data) {
                            if (data) {
                                localStorage.setItem('jsBridgeHeaders', data); // 缓存设备信息
                            }
                        })
                        jsBridge.callAppRouter("JS_IsCareMode", "", function (data) {
                            if (data) {
                                const careMode = JSON.parse(data)?JSON.parse(data).careMode : 0;
                                if (careMode == 1) {
                                    document.body.style.fontSize = '19px';
                                    $('.care-mode').addClass('is-care-mode');
                                    $('.contianer').addClass('care-contianer');
                                }
                                sessionStorage.setItem('userCareMode', careMode);
                            } else {
                                const careMode = sessionStorage.getItem('userCareMode');
                                if (careMode == 1) {
                                    document.body.style.fontSize = '19px';
                                    $('.care-mode').addClass('is-care-mode');
                                    $('.contianer').removeClass('care-contianer');
                                }
                            }
                        })
                    },500)
                    
                    if(!sessionStorage.getItem('isHomePage')){
                        sessionStorage.setItem('isHomePage',window.location.href);// 储存首次进来的路径
                    }
                    $(".weui-icon-back").parent().click(function () {
                        // 没有历史记录，可以执行其他逻辑，比如返回首页或者其他操作
                        if(jsBridge && sessionStorage.getItem('isHomePage') === window.location.href){
                            jsBridge.callAppRouter("JS_backToHomePage", '', function (data) {})
                        }
                    });
                }


            });

    </script>

    <script type="text/javascript">
        if ("") {
            $(".left").hide();
            $(".notools").hide();
        }
        var pageNo = 0;
        var cacheDataList = null;
        var isEnd = false;
        var loading = false;  //状态标记
        var curSelectedType = "";
        var urlParams = {};
        var types = [];//根据类别进行分类
        var personInfo = {};
        var payLoadTypeList = [];
        var cacheInit = { type: false, record: false };

        const deptName = common.getQueryString("deptName"); // 科室
        
        $(function () {
            var empi = common.getQueryString("empi");
            var admitDate = common.getQueryString("admitDate");
            var domain = common.getQueryString("domain");
            var flowId = common.getQueryString("id");
            var mzbl = common.getQueryString("mzbl");
            var pageType = common.getQueryString("type");
            var cost = common.getQueryString("cost");
            var inStart = common.getQueryString("inStart"); // 判断是否有值，右上角返回列表
            var encrypted_access_token_t = common.getQueryString("encrypted_access_token_t"); // 判断是否有值，右上角返回列表

            urlParams = {
                empi: empi,
                admitDate: admitDate,
                domain: domain,
                id: flowId
            };
            if(!pageType && !cost){
                if(inStart == "I"){
                    $(".common-header>.tools").html(`<div class='back-list'></div>列表`);
                }else{
                    $(".common-header>.tools").html(``);
                }
            }
            $(".common-header>.tools").click(function () {
                const deptCode = common.getQueryString("deptCode");
                const tName = decodeURIComponent(pageType);
                if(!pageType && !cost && inStart == "I"){
                    history.go(-3);
                    return;
                } 
                location.href = navRoot + `/record?id=${empi}&type=${encodeURIComponent(tName)}&cost=${cost}&deptCode=${deptCode}&inStart=${inStart}`;
            })
            $("#contentDiv").pullToRefresh({
                onRefresh: function () { /* 当下拉刷新触发的时候执行的回调 */
                    pageNo = 0;
                    isEnd = false;
                    types = [];
                    cacheDataList = null;
                    $(".weui-loadmore").remove();
                    if (curSelectedType == "yizhu") {
                        $("#recordTypeContent").empty();
                        yz_search();
                    } else if (curSelectedType == "payLoadType.JianYan") {
                        $("#jy_table").empty();
                        jy_getPage();
                    } else if (curSelectedType == "payLoadType.JianCha") {
                        sessionStorage.setItem('info-selected_record_table_index','[]');
                        $("#jc_table").empty();
                        jc_getPage();
                    } else if(curSelectedType =='patientInfos'){
                        isEnd = true;
                        $("#contentDiv").pullToRefreshDone();
                        return;
                    } else {
                        $("#recordTypeContent").empty();
                        getContentList();
                    }
                    $("#contentDiv").pullToRefreshDone();
                },
                distance: 50 /* 下拉刷新的触发距离， 注意，如果你重新定义了这个值，那么你需要重载一部分CSS才可以，请参考下面的自定义样式部分 */
            });
            $("#contentDiv").infinite(100);
            $("#contentDiv").on("infinite", function () {
                if (loading == true) return;
                if (isEnd == true) return;
                loading = true;
                pageNo++;
                $(".weui-loadmore").remove();
                console.log("加载第%s页", pageNo);
                var loadMoreBtn = $('<div class="weui-loadmore loadMoreBtn"><i class="weui-loading"/><span class="weui-loadmore__tips">正在加载</span></div>');
                $("#recordTypeContent").append(loadMoreBtn);
                if (curSelectedType == "yizhu") {
                    
                    yz_search();
                } else {
                    
                    getContentList();
                }
            });
            $.post(navRoot + "/api/inpatient/info", urlParams, function (data) {
                    if (data["code"] == 200) {
                        personInfo = data["data"]["personInfo"];
                        $("#patient_name").text(personInfo["name"]);
                        $("#patient_age_sex").text("（" + personInfo["age"] + "岁," + (personInfo["genderCd"] == "M" ? "男" : "女") + "）");
                        // $("#patient-info").html(`<div class="collect cancel" collect="2"><img src="/ccd/static/images/ncollect.png" alt=""> <span>收藏</span></div>`)
                        
                        if (!encrypted_access_token_t){
	                        getCollect(); // 查看收藏状态
						}
                        
                        payLoadTypeList = data["data"]["payLoadTypeList"];
                        for (var i in payLoadTypeList) {
                            if (payLoadTypeList[i]["name"] == "医嘱") continue;
                            if (payLoadTypeList[i]["name"] == "病案首页") continue;
                            var item = $('<a href="javascript:" type="button" class="weui-btn weui-btn_mini">' + payLoadTypeList[i]["name"] + '</a>');
                            if (payLoadTypeList[i]["name"] == "病程记录") {
                                item.addClass("")
                            }
                            item.data("data", payLoadTypeList[i]);
                            item.click(function () {
                                pageNo = 0;
                                types = [];
                                isEnd = false;
                                $(this).siblings(".selected").removeClass("selected");
                                $(this).addClass("selected");
                                $("#yz_title").empty();
                                $(".contianer iframe").remove();
                                $(".weui-pull-to-refresh__layer").show();
                                
                                var loadMoreBtn = $('<div class="weui-loadmore loadMoreBtn"><i class="weui-loading"/><span class="weui-loadmore__tips">正在加载</span></div>');
                                $("#recordTypeContent").append(loadMoreBtn);
                                $("#recordTypeContent").empty();
                                $(".loadMoreBtn").remove();
                                $('meta[name="viewport"]').attr('content', "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no");
                                if ($(this).data("data")["type"] == "payLoadType.JianYan") {
                                    jy_getPage();
                                } else if ($(this).data("data")["type"] == "payLoadType.JianCha") {
                                    jc_getPage();
                                } else {
                                    getContentList();
                                }
                                saveSelectedItemIndex();
                            });
                            
                            $("#type_btn_group").append(item);
                            
                        }
                        if (mzbl == "false") {
                            var item = $('<a href="javascript:" type="button" class="weui-btn weui-btn_mini">护理记录</a>');
                            item.click(function () {
                                types = [];
                                pageNo = 0;
                                isEnd = true;
                                $(".contianer iframe").remove();
                                $(".loadMoreBtn").remove();
                                $(this).siblings(".selected").removeClass("selected");
                                $(this).addClass("selected");
                                $('meta[name="viewport"]').attr('content', "width=device-width, initial-scale=1;minimum-scale=1.0");
                                hljl_getPage();
                                saveSelectedItemIndex();
                            });
                            $("#type_btn_group").append(item);
                            item = $('<a href="javascript:" type="button" class="weui-btn weui-btn_mini">医嘱</a>');
                            item.click(function () {
                                types = [];
                                pageNo = 0;
                                isEnd = false;
                                $(".loadMoreBtn").remove();
                                $(".contianer iframe").remove();
                                $(".weui-pull-to-refresh__layer").show();
                                
                                $(this).siblings(".selected").removeClass("selected");
                                $(this).addClass("selected");
                                $('meta[name="viewport"]').attr('content', "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no");
                                yz_getPage();
                                saveSelectedItemIndex();
                            });
                            $("#type_btn_group").append(item);
                        }
                       
                        const patientItem = $('<a href="javascript:" type="button" class="weui-btn weui-btn_mini">基本信息</a>');
                        patientItem.click(function () {
                            isEnd = true;
                            $(".loadMoreBtn").remove();
                            $(".contianer iframe").remove();
                            $(".weui-pull-to-refresh__layer").show();
                            $(this).siblings(".selected").removeClass("selected");
                            $(this).addClass("selected");
                            $('meta[name="viewport"]').attr('content', "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no");
                            patientInfo_getPage();
                            saveSelectedItemIndex();
                        });

                        $("#type_btn_group").append(patientItem);


                        var selectedIndex = sessionStorage.getItem('info-selected_index');
                        if(selectedIndex){
                            $("#type_btn_group").find("a:nth(" + selectedIndex + ")").trigger("click");
                        } else if ($("#type_btn_group").find(".CA").text() != "") {
                            $("#type_btn_group").find(".CA").trigger("click");
                        } else {
                            $("#type_btn_group").find("a:first").trigger("click");

                );
            }
            if(personInfo.patCategoryName.indexOf('住院') > -1){
                patientInfo.splice(5, 0, 
                    {title: '床位号', value: personInfo.patCurrentBed},
                    {title: '病区', value: decodeURIComponent(deptName)}
                );
            }

            for (let i in patientInfo) {
                const itemData = patientInfo[i];
                const pi_items = $(`<div class="pi-info bg-white">\
                            <div>${itemData.title}</div>\
                            <div class="text-right ${itemData.type || ''}"></div>\
                            </div>`);
                if(itemData.type === 'phone'){
                    const phoneIcon = `<img src="/ccd/static/images/phone.png" class="icon">`;
                    if (itemData.tel) {
                        pi_items.find('.text-right').html(`${phoneIcon}${itemData.value}`);
                    }
                    if (!itemData.tel || itemData.tel === null) {
                        pi_items.hide();
                    }
                }else{
                    pi_items.find('.text-right').text(itemData.value);
                }
                pi_items.find('.phone').click(function(){
                    window.location.href = 'tel:' + itemData.tel;                  
                })
                $("#recordTypeContent").append(pi_items);
            }
            // 判断是否有诊断
            const listParams = payLoadTypeList.filter(v=>v.type === 'payLoadType.Incharge')[0];
            if(listParams){
                var params = {
                    "empi": urlParams.empi,
                    "id": urlParams.id,
                    "domain": urlParams.domain,
                    "admitDate": urlParams.admitDate,
                    "payLoadType": listParams["value"] || '',
                    "type": listParams["type"],
                    "pageNo": '0'
                };
                $.showLoading();
                $.post(navRoot + "/api/inpatient/data", params, function (data) {
                    $.hideLoading();
                    if (data["code"] == 200) {
                        const pDocumentList = data.data.list[0].documentList[0];
                        var plt = pDocumentList.payLoadType;
                        if (plt.indexOf("XDS.ProgressNote") >= 0) {
                            plt = "XDS.ProgressNote";
                        } else if (plt.indexOf("XDS.ABW") >= 0) {
                            plt = "XDS.ABW";
                        }
                        var pltArr = plt.split('.');
                        pltArr.shift();

                        var payLoadType = pltArr.join('_');
                        var reportProps = Const.reportProps[payLoadType] || {};
                        var postObj = {
                            documentuniqueid: (pDocumentList["documentuniqueid"] || ""),
                            filepath: (pDocumentList["filepath"] || ""),
                            fileSystemFk: (pDocumentList["fileSystemFk"] || ""),
                            dicomNum: (pDocumentList["dicomNum"] || ""),
                            reportStatus: (pDocumentList["reportStatus"] || ""),
                            modality: (pDocumentList["modality"] || ""),
                            dicomStudyTime: (pDocumentList["dicomStudyTime"] || ""),
                            nodes: (reportProps.nodes || ["//ClinicalDocument"]),
                            parseModel: (reportProps.parseModel || "0"),
                            imageNode: (pDocumentList["imageNode"] || ""),
                            name: personInfo["name"]
                        };
                        $.showLoading();
                        $.getJSON(navRoot + "/api/inpatient/showinfo/plt", {"documentVO_2_paramData": JSON.stringify(postObj)}, function (res) {
                            $.hideLoading();
                            if (res["code"] == 200) {
                                const diagnosis = res.data.nameValueMap.contentList.filter(v=>v.name.indexOf('初步诊断')>-1)[0].text || '';
                                const pi_items = $(`<div class="pi-info bg-white">\
                                <div>诊断</div>\
                                <div class="text-right">${diagnosis}</div>\
                                </div>`);
                                $("#recordTypeContent").append(pi_items);
                            } else {
                                $.alert(res["errmsg"]);
                            }
                        })
                    }else{
                        $.alert(data["errmsg"]);
                    }
                })
            }
            


            
        }

        /**
         * 缓存已选择的类型
         */
        function saveSelectedItemIndex () {
            var index = $("#type_btn_group").find("a.selected").index();
            sessionStorage.setItem('info-selected_index', index);
            if (cacheInit.type) {
                sessionStorage.removeItem('info-selected_record_index');
                sessionStorage.setItem('info-selected_record_table_index','[]');
            }
            cacheInit.type = true;
        }
    </script>

</body>
</html>
