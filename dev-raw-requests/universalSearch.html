    <script type="text/javascript">
            $(function(){
                if (jsBridge ) {
                    setTimeout(function(){
                        jsBridge.callAppRouter("phoneInfo", "", function (data) {
                            if (data) {
                                localStorage.setItem('jsBridgeHeaders', data); // 缓存设备信息
                            }
                        })
                        jsBridge.callAppRouter("JS_IsCareMode", "", function (data) {
                            if (data) {
                                const careMode = JSON.parse(data)?JSON.parse(data).careMode : 0;
                                if (careMode == 1) {
                                    document.body.style.fontSize = '19px';
                                    $('.care-mode').addClass('is-care-mode');
                                    $('.contianer').addClass('care-contianer');
                                }
                                sessionStorage.setItem('userCareMode', careMode);
                            } else {
                                const careMode = sessionStorage.getItem('userCareMode');
                                if (careMode == 1) {
                                    document.body.style.fontSize = '19px';
                                    $('.care-mode').addClass('is-care-mode');
                                    $('.contianer').removeClass('care-contianer');
                                }
                            }
                        })
                    },500)
                    
                    if(!sessionStorage.getItem('isHomePage')){
                        sessionStorage.setItem('isHomePage',window.location.href);// 储存首次进来的路径
                    }
                    $(".weui-icon-back").parent().click(function () {
                        // 没有历史记录，可以执行其他逻辑，比如返回首页或者其他操作
                        if(jsBridge && sessionStorage.getItem('isHomePage') === window.location.href){
                            jsBridge.callAppRouter("JS_backToHomePage", '', function (data) {})
                        }
                    });
                }


            });

    </script>

<script type="text/javascript">

    history.replaceState(null, '', location.href.replace(/(op_code=.*?(&|$))|(dept_code=.*?(&|$))|(token=.*?(&|$))/g, ''));
    $(function () {
        const universalSearch = JSON.parse(sessionStorage.getItem('universalSearch'));
        if (universalSearch) {
            $("#select_type").attr("data", select_type).text(select_type === "0" ? "住院号" : "门诊号");
            $("#select_no").attr("placeholder", select_type === "0" ? "请输入患者住院号" : "请输入患者门诊号").val(select_type === "0" ? universalSearch.inpatient_no : universalSearch.card_no);
            $(".select_text").text(select_type === "0" ? "住院号" : "门诊号");
            $('#id_no').val(universalSearch.id_no);
            $('#patient_name').val(universalSearch.patient_name);
        }

        window.addEventListener('pageshow', function(event) {
            // 移除页面缓存
            sessionStorage.removeItem('list_universal_scrollTop');
            sessionStorage.removeItem('list_universal_params');
            sessionStorage.removeItem('universalSearch');
        });

        // 重置表单
        $("#cancelBtn").click(function () {
            $("#start_date").picker("setValue", common.getNextDay(-31).split("-"));
            $("#end_date").picker("setValue", common.getNextDay(0).split("-"));
            $("#patient_name").val("");
            $("#inpatient_no").val("");
            $("#id_no").val("");
            $("#select_type").attr('data', '0').text('住院号');
            $(".select_text").text('住院号');
            $("#select_no").attr("placeholder", "请输入患者住院号").val("");
            sessionStorage.removeItem('universalSearch');
        });

        $("#start_date").datetimePicker({
            "yearSplit": "-",
            "monthSplit": "-",
            "value": universalSearch ? universalSearch.start_date + " " : (common.getNextDay(-31) + " "),
            years: (function () {
                var arr = [];
                for (var i = 1900; i <= 2030; i++) {
                    arr.push(i);
                }
                return arr;
            })(),
            "times": function () {
                return []
            },
            onClose: function (e) { }
        });

        $("#end_date").datetimePicker({
            "yearSplit": "-",
            "monthSplit": "-",
            "value": universalSearch ? universalSearch.end_date + " " : (common.getNextDay(0) + " "),
            years: (function () {
                var arr = [];
                for (var i = 1900; i <= 2030; i++) {
                    arr.push(i);
                }
                return arr;
            })(),
            "times": function () {
                return []
            },
            onClose: function (e) { }
        });

        $("#select_no").focus(function(e){
            if ($("#select_type").attr("data") === '0') {
                const val = $(this).val();
                const startText = "ZY01";
                (val.indexOf(startText) === 0) || ($(this).val(startText));
            }
        })

        $("#select_type").click(function () {
            var actions = [
                {
                    text: "住院号",
                    onClick: function () {
                        $("#select_type").attr("data", "0").text("住院号");
                        $("#select_no").attr("placeholder", "请输入患者住院号").val('');
                        $(".select_text").text("住院号");
                    }
                },
                {
                    text: "门诊号",
                    onClick: function () {
                        $("#select_type").attr("data", "1").text("门诊号");
                        $("#select_no").attr("placeholder", "请输入患者门诊号").val('');
                        $(".select_text").text("门诊号");
                    }
                }
            ]
            $.actions({
                actions: actions
            })
        })

        $("#searchBtn").click(function () {
            const patient_name = $("#patient_name").val().trim();
            const select_no = $("#select_no").val().trim();
            const id_no = $("#id_no").val().trim();
            const start_date = $("#start_date").val().trim().split("-").join("") + "000000";
            const end_date = $("#end_date").val().trim().split("-").join("") + "235959";
            if (Number(start_date) > Number(end_date)) {
                $.alert('开始时间不能大于结束时间');
                return;
            }
            if (!patient_name && !select_no && !id_no) {
                $.alert('当前条件必填一项');
                return;
            }
            const params = {
                patient_name,
                inpatient_no: $("#select_type").attr("data") === '0' ? select_no : '',
                card_no: $("#select_type").attr("data") === '1' ? select_no : '',
                id_no,
                start_date,
                end_date
            };
            // 存储表单数据
            sessionStorage.setItem('universalSearch', JSON.stringify({ ...params, start_date: $("#start_date").val().trim(), end_date: $("#end_date").val().trim(), select_type: $("#select_type").attr("data") }));
            const queryString = Object.keys(params)
                .filter(key => params[key])
                .map(key => `${key}=${params[key]}`)
                .join('&');
            location.href = navRoot + '/universal/list?params=' + encodeURIComponent(queryString);
        });
    })
</script>
