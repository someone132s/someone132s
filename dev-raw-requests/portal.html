<script type="text/javascript">
    var navRoot = "/portal";
    if (navRoot.indexOf("https") < 0) {
        navRoot = navRoot.replace("http:", "https:");
    }
    if (jsBridge && window.isAndroid) {
        var path = document.location.href;
        const isScreenshot = {
            is_screenshot: path.indexOf('login') > -1 ? 0 : 0,
        }
        jsBridge.callAppRouter("JS_canScreenshot", JSON.stringify(isScreenshot), function(data){
            if (data != null) {
                console.log('通知成功');
            } else {
                'function' === typeof callback && callback(data);
            }
        })
    }
    if(jsBridge){
        // 获取app 当前用户是否关怀模式状态
        jsBridge.callAppRouter("JS_IsCareMode", "", function(data){
            if (data) {
                localStorage.setItem('userCareMode', JSON.parse(data)?JSON.parse(data).careMode : 0); // 缓存设备信息
            }else{
                localStorage.setItem('userCareMode', localStorage.getItem("userCareMode") || 0);
            }
        })
    }
    window.addEventListener('resize', function() {
        var event = new Event('resize');
        document.dispatchEvent(event);
    });
</script>

        function opDeptListPicker(target_url, deptId, list){
            const op_html = $(' <div class="op-dept-picker show">'+

                            '    <div class="pact-content">'+
                            '        <div class="title-head text-center">'+

                            '        </div>'+
                            '        <div id="picker-container"></div>'+
                            '        <input type="hidden" id="inline" class="weui-input" value="">'+
                            '    </div>'+
                            '</div>');
            $('#home_tab').append(op_html)
            op_html.find('.close-dept-picker').click(function(){
                $('#home_tab').find('.op-dept-picker').remove();
            });
            op_html.find('.sumbit-picker').click(function(){
                const op_code = op_html.find('#inline').val();
                $('#home_tab').find('.op-dept-picker').remove();
                fetchNewToken(target_url, deptId, op_code)
            });
            $("#inline").picker({
                container: '#picker-container',
                cols: [{
                    textAlign: 'center',
                    values: list,
                }],
            });
        }

        function fetchNewToken(target_url, deptId, op_code){
            $.getJSON(navRoot + "/newtoken", {mod_code:target_url === 'QXST'? target_url:''}, function (data) {
                if (data["code"] == 200) {
                    if(target_url === 'QXST'){
                        target_url = 'ccd/universalSearch';
                    }
                    var token = data["data"]["access_token"];
                    let url = "https://yihu.gzsums.net/" + target_url + "?token=" + token + "&deptId=" + deptId.trim();
                    if(op_code){
                        url = "https://yihu.gzsums.net/" + target_url + "/patientList?token=" + token + "&dept_code=" + deptId.trim()+"&op_code="+encodeURIComponent(op_code);
                    }
                    const param = {
                        redirectUrl: url,
                        is_screenshot: data.data.is_screenshot || 0, // 1为不允许截图，0允许
                        title: "全景病历"
                    };
                    if (jsBridge) {
                        jsBridge.callAppRouter("openDoctorNew", JSON.stringify(param), function(data){
                            if (data != null) {
                                console.log(data);
                            } else {
                                location.href = url;
                            }
                        })
                    }
                } else {
                    location.href = navRoot + "/login";
                }
            });
        }

        function choisDept(target_url, deptId, dept_type) {
            if(['O', 'OP'].includes(dept_type)){
                $.closeModal();
                $.showLoading();
                $.getJSON(navRoot + "/getOpDeptList",{ dept_code: deptId}, function (data) {
                    $.hideLoading();
                    if (data["code"] == 200) {
                        opDeptListPicker(target_url, deptId, data['data']);
                    } else {
                        $.alert(data['errmsg']);
                    }
                });
            } else if(target_url === "JZHZ"){
                location.href = navRoot + "/outpatient";
            } else {
                fetchNewToken(target_url, deptId);
            }
            
        }

        // 检索科室列表，根据关键字重新渲染
        function searchDept(){
            const keyword = $(".dept-search-input").val().trim();
            const href = $(".mod-search").attr('href');
            const dept_list = ccdDeptList.filter(item => item.DEPT_NAME.includes(keyword));
            $(".dept-list").empty();
            if(dept_list && dept_list.length){
                for (var i in dept_list) {
                    if (href == "#critical" && dept_list[i]["DEPT_TYPE"] !== "I"){
                        continue;
                    }
                    if (href == "#ccd" && dept_list[i]["DEPT_TYPE"] !== "I" && dept_list[i]["DEPT_TYPE"] !== "O" && dept_list[i]["DEPT_TYPE"] !== "OP") {
                        continue;
                    }
                    var item = $('' +
                        '<div class="weui-cell" onclick="choisDept(\'' + href.substring(1) + '\',\'' + dept_list[i]["CODE"] + '\',\'' + dept_list[i]["DEPT_TYPE"] +  '\')">' +
                        '<div class="weui-cell__hd">' +
                        dept_list[i]["DEPT_NAME"] +
                        '</div>' +
                        '</div>');
                    $(".dept-list").append(item);
                }
            } else {
                $(".dept-list").append("<div class='weui-cell' style='justify-content: center;'>暂无数据</div>");
            }
            
        }

            // 创建可展示的模块节点
        function handleData(data,all_data) {
            //第一参数为需要展示的模块code，第二参数为所有的模块信息
            let html = ''
            data.forEach(item => {
                let id='';
                let jump_flag='jump_next';
                let url=a_url[all_data[item].code]
                if(item=='HLWYY'){
                    id='yzs_badge';
                }
                if(!all_data[item].has_auth){
                    url='#';
                    jump_flag='jump_next disabledItem'
                }
                html += '<a href="' + url + '" class="weui-grid '+jump_flag+'" type='+all_data[item].type+' code='+all_data[item].code+'><div class="weui-grid__icon">' +
                    '<img src="' + all_data[item].icon_url + '" alt="">' +
                    '<span id="'+id+'" class="weui-badge read '+id+'" style="display: none"></span>'+
                    '</div><p class="weui-grid__label">' + all_data[item].name + '</p></a>'                
            }); 
            return html;
        }
        // 常用模块单独添加最后的添加模块
        function addModul(data,all_data) {
            let img_url='/portal/static/images/add.png';
            let add_html = '<a href="#" class="weui-grid add_normal_mods"><div class="weui-grid__icon">' +
                '<img src="'+img_url+'" alt="">' +
                '</div><p class="weui-grid__label">添加</p></a>'
            let html = handleData(data,all_data)
            return html + add_html;
        }

            // 删除已有模块
            function deleteItem(){
            $('.delete_item').off('click').click(function(){
                $(this).removeClass('delete_item').addClass('add_item')
                $(this).parent().find('.drag_class').remove();//删除拖拽标志
                let html=$(this).parent().prop("outerHTML");//获取节点

                // POST /portal/module/common-used
                $.ajax({
                    url:navRoot+'/module/common-used',
                    type:'POST',
                    data:JSON.stringify(postData),
                    dataType:'json',
                    contentType:'application/json',
                    success:function (data) {
                        obj.parent().remove();
                        $('#other_mods').append(html)
                        addItem();

                    error:function (data) {
                        alert(data.msg)

            })

            //创建添加模块页面的节点
            function creatAddOrDeleteNode(flag,showData,all_data){
            let html='';
            if(flag){//TRUE为已有模块的节点
                showData.forEach(item=>{
                    html+='<li class="modules_item flex_box">'+
                        '<div class="delete_item" code="'+all_data[item].code+'"></div>'+
                        '<div class="flex_box"><img src="'+all_data[item].icon_url+'" alt=""></div>'+
                        '<div>'+all_data[item].name+'</div><span class="drag_class">&#9776;</span></li>'
                    })
                }else{//FALSE为需要添加的模块节点
                    //添加的模块只展示有权限的模块
                    let real_mods=[]
                    let all_data_key=Object.keys(all_data)
                    for (let i = 0; i < all_data_key.length; i++) {
                         if(all_data[all_data_key[i]].has_auth){
                            real_mods.push(all_data[all_data_key[i]].code);
                         }
                     }
                    let add_item=showData.concat(real_mods).filter(function(v,i,arr){
                        return arr.indexOf(v)===arr.lastIndexOf(v)
                    })//获取非常用模块的信息
                    add_item.forEach(item=>{
                        html+='<li class="modules_item flex_box">'+
                        '<div class="add_item" code="'+all_data[item].code+'"></div>'+
                        '<div class="flex_box"><img src="'+all_data[item].icon_url+'" alt=""></div>'+
                        '<div>'+all_data[item].name+'</div></li>'
                    })
            }
            return html;
        }

            html=creatAddOrDeleteNode(false,data.common_mod_codes,data.all_mods);
            $('#other_mods').html(html);

            deleteItem()
            addItem()
        }

                platform = "weixin";

                platform = "alipay";
            } else if (/(iPhone|iPad|iPod)/i.test(ua)) {
                platform = "ios";
            } else if (ua.indexOf('Android') > 0) {
                platform = "android";
            }
            
            if (jsBridge) {
                jsBridge.callAppRouter("phoneInfo", "", function (data) {

                            "osType": osType,

                        }
