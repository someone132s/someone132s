            $(function(){
                if (jsBridge ) {
                    setTimeout(function(){
                        jsBridge.callAppRouter("phoneInfo", "", function (data) {
                            if (data) {
                                localStorage.setItem('jsBridgeHeaders', data); // 缓存设备信息
                            }
                        })
                        jsBridge.callAppRouter("JS_IsCareMode", "", function (data) {
                            if (data) {
                                const careMode = JSON.parse(data)?JSON.parse(data).careMode : 0;
                                if (careMode == 1) {
                                    document.body.style.fontSize = '19px';
                                    $('.care-mode').addClass('is-care-mode');
                                    $('.contianer').addClass('care-contianer');
                                }
                                sessionStorage.setItem('userCareMode', careMode);
                            } else {
                                const careMode = sessionStorage.getItem('userCareMode');
                                if (careMode == 1) {
                                    document.body.style.fontSize = '19px';
                                    $('.care-mode').addClass('is-care-mode');
                                    $('.contianer').removeClass('care-contianer');
                                }
                            }
                        })
                    },500)
                    
                    if(!sessionStorage.getItem('isHomePage')){
                        sessionStorage.setItem('isHomePage',window.location.href);// 储存首次进来的路径
                    }
                    $(".weui-icon-back").parent().click(function () {
                        // 没有历史记录，可以执行其他逻辑，比如返回首页或者其他操作
                        if(jsBridge && sessionStorage.getItem('isHomePage') === window.location.href){

                        }
                    });
                }


            });

        function getCCDList(searchType) {
            $("#ccd-list").empty();
            $.showLoading();
            if (sessionStorage.getItem("list_type")) {
                var cache_type = sessionStorage.getItem("list_type");
                sessionStorage.removeItem("list_type");
                $("#clinic_type_btnGroup a.selected").removeClass("selected");
                $("#clinic_type_btnGroup a[data-value='" + cache_type + "']").addClass("selected");
            }
            var type = $("#clinic_type_btnGroup a.selected").attr("data-value");
            var start_date = $("#start_date").val().trim();
            if (start_date != "") {
                start_date = start_date.split("-").join("") + "000000";
            }
            var end_date = $("#end_date").val().trim();
            if (end_date != "") {
                end_date = end_date.split("-").join("") + "235959";
            }
            var patient_name = $("#patient_name").val().trim();
            var inpatient_no = $("#inpatient_no").val().trim();
            var inpatient_diagnose = $("#inpatient_diagnose").val().trim();
            if (searchType == "search") {
                var select_type = $("#select_type").attr("data");
                $("#clinic_type_btnGroup a.selected").removeClass("selected");
                $("#clinic_type_btnGroup a[data-value='" + select_type + "']").addClass("selected");
                type = select_type;
            }

            var params = {
                "type": type,
                "dept_id": dept_id,
                "patient_name": patient_name,
                "inpatient_no": inpatient_no,
                "inpatient_diagnose": inpatient_diagnose
            };
            if (sessionStorage.getItem("list_params")) {
                var cache_params = sessionStorage.getItem("list_params");
                params = JSON.parse(cache_params);
                sessionStorage.removeItem("list_params");
            }
            if (type != "I") {
                params["end_date"] = end_date;
                params["start_date"] = start_date;
            }
            $.post(navRoot + "/api/inpatient/list", params, function (data) {
                if (data["code"] == 200) {
                    var list = [];
                    try {
                        if (data["data"]["List"]) {

                            var dataObj = data["data"]["List"]["InPatientMainInfo"];
                            if (!dataObj.hasOwnProperty("length")) {
                                list[0] = dataObj;
                            } else {
                                list = dataObj;
                            }
                            if(type == "I"){
                                $(".patient-number").text(list.length);
                            }
                            cacheDataList = list;
                            for (var i in list) {
                                const InPatientMainInfo = list[i];
                                const item = $('<div class="weui-well weui-well_access">' +
                                    '<div class="weui-well__top weui-flex">' +
                                    '    <div class="weui-flex__item inOrOutTime">' + InPatientMainInfo["NAME"] + " " + InPatientMainInfo["BED_NO"].substring(4) + '床</div>' +
                                    '    <div class="critical_flag font12 font-bold text-common"></div>' +
                                    '</div>' +
                                    '<div class="weui-well__footer">' +
                                    '   <div class="weui-flex">' +
                                    '       <div class="weui-flex__item font12">住院诊断：' + InPatientMainInfo["DIAG_NAME1"] + '</div>' +
                                    '   </div>' +
                                    '</div>' +
                                    '</div>'
                                );
                                if (type == "O") {
                                    item.find(".inOrOutTime").append($("<small>出院时间：" + common.dateFormart(InPatientMainInfo["OUT_DATE"], "yyyy年MM月dd日") + "</small>"))
                                } else {
                                    item.find(".inOrOutTime").append($("<small>住院天数：" + common.transDateInterval(InPatientMainInfo["IN_DATE"]) + "</small>"))
                                }
                                if (InPatientMainInfo["CRITICAL_FLAG"] == "1") {
                                    item.find(".critical_flag").text("病重");
                                } else if (InPatientMainInfo["CRITICAL_FLAG"] == "2") {
                                    item.find(".critical_flag").text("病危");
                                } else {
                                    item.find(".critical_flag").text("普通");
                                }

                                item.data("info", InPatientMainInfo);
                                item.data("id", InPatientMainInfo["INPATIENT_NO"]);
                                item.click(function () {
                                    var id = $(this).data("info")["EMPI"];//修改为EMPI作为逐渐查询时间轴
                                    
                                    var type = $(this).data("info")["PACT_NAME"];
                                    var cost = $(this).data("info")["FREE_COST"];
                                    var admitDate = $(this).data("info")["IN_DATE"];
                                    var inpat_no = $(this).data("info")["INPATIENT_NO"];
                                    sessionStorage.setItem("list_scrollTop", $(".ccdList-page").scrollTop());
                                    sessionStorage.setItem("list_params", JSON.stringify(params));
                                    sessionStorage.setItem("list_type", params.type);
                                    var deptCode = $(this).data("info")["DEPT_CODE"];
                                    if(InPatientMainInfo['IN_STATE'] == 'I'){
                                        window.location.href = navRoot + `/info?empi=${id}&admitDate=${admitDate}&domain=2.16.840.1.113883.4.487.2.1.4.4&mzbl=false&id=${inpat_no}&deptCode=${deptCode}&type=${encodeURIComponent(type)}&cost=${cost}&inStart=I&access_channel=inpatient&deptName=${InPatientMainInfo['DEPT_NAME']}`;
                                    }else{
                                        location.href = navRoot + "/record?id=" + id + "&type=" + encodeURIComponent(type) + "&cost=" + cost + "&deptCode=" + deptCode + "&access_channel=inpatient" + "&deptName=" + InPatientMainInfo['DEPT_NAME'];
                                    }
                                });
                                $("#ccd-list").append(item);
                            }
                        } else {
                            $("#ccd-list").append('<div class="weui-loadmore weui-loadmore_line"><span class="weui-loadmore__tips">暂无数据</span></div>');
                        }
                        if (sessionStorage.getItem("list_scrollTop")) {
                            $(".ccdList-page").scrollTop(sessionStorage.getItem("list_scrollTop"));
                            sessionStorage.removeItem("list_scrollTop");
                        }
                    } catch (err) {
                        $.alert("数据错误:" + err);
                    }
                } else if (data["code"] == 501) {
                    $("#ccd-list").append('<div class="weui-loadmore weui-loadmore_line"><span class="weui-loadmore__tips">暂无数据</span></div>');
                } else {
                    $.alert(data["errmsg"]);
                }
                $.hideLoading();
            }, "json")
        }
    </script>

</body>
</html>
