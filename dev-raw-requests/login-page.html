        if(!!hasShowADNew && !!hasShowAD){
            requestFlag = 0
        } else if (!!hasShowAD ^ !!hasShowADNew) {
            requestFlag = 1
        } else {
            requestFlag = 2
        }
        var u = navigator.userAgent,
        isAndroid = u.indexOf('Android') > -1 || u.indexOf('Adr') > -1;
        // 请求广告
        // 仿照promise 格式回调处理方法 
        // @param resolve   请求成功处理完事务回调
        //        reject    请求失败处理完事务回调
        function requestAD(resolve, reject){
                $.getJSON(navRoot + "/window", function (data) {
                    if (data && data["code"] == 200) {
                        data = data["data"];
                        if (data && data["is_show"]) {
                            var floatAD = $('<div style="position:absolute;display: flex;align-items: center;justify-content: center;width: 100%;height: 100%;z-index: 2001;">' +
                                '<div class="weui-mask weui-mask--visible" style="background: rgba(140,4,16);"></div>' +
                                '<div style="text-align:center;max-width:100%;max-height:100%;z-index: 1050;">' +
                                '<img class="windowAD" style="max-width:100%;max-height:100%;" src="' + data["img_url"] + '">' +
                                '</div>' +
                                '</div>');
                            floatAD.find('img').on('load', function(){
                                $("body").append(floatAD);
                                setTimeout(function () {
                                    floatAD.fadeOut();
                                }, 2500);
                            })
                            sessionStorage.setItem("hasShowAD", "true");
                            resolve && resolve()
                        }
                    } else {
                        reject && reject()
                    }
                    requestFlag--
                });
        }
        // 新版请求广告
        function requestADNew(resolve, reject){
            $.getJSON(navRoot + "/richtext?code=yihu_home_notice", function (data) {
                if (data && data["code"] == 200) {
                    data = data["data"];
                    if (data && data["is_show"]) {
                        var AD = data["content"];
                        var floatAD = '<div style="text-align: left">' + AD + '</div>';
                        $.confirm({
                            title: data['title'] || '温馨提示',
                            text: floatAD,
                            onOK: function () {
                            },
                        });
                        sessionStorage.setItem("hasShowADNew", "true");
                        resolve && resolve()
                    }
                } else {
                    console.log(JSON.stringify(data))
                    reject && reject()
                }
                requestFlag--
            })
        }

            return requestFlag === 0;

        $.removeCookie("yihu-portal")
        
        !hasShowAD && requestAD(checkVerifyCodeRequestable);

        //表单验证
        //点击下一步事件
        function checkForm($form) {
            var success = true;
            $form.find("input").each(function () {
                var $that = $(this);
                if ($that.val() == "") {
                    success = false;
                    $.toast($that.attr("placeholder"), "text");
                    
                    return false;
                } else {
                    var dataType = eval($that.attr("datatype"));
                    if (dataType != undefined) {
                        if ($that.val().match(dataType)) {
                        } else {
                            $.toast($that.attr("dataerr"), "text");
                            success = false;
                            
                            return false;
                        }
                    }
                }
            });
            if (!$('#privacy_checkbox').prop('checked')) {
                $.alert('请先同意用户隐私协议');
                return false;
            }
            return success;
        }

            } else {

        // 切换密码可视
        function switchSeeFun(event) {
            $that = $(event.currentTarget);
            var passwordInput = $that.parents(".weui-cell").find("input");
            var type = passwordInput.attr("type");
            if (type == "password") {
                $that.html("&#xe624;");
                passwordInput.attr("type", "text");
            } else {
                $that.html("&#xe625;");
                passwordInput.attr("type", "password");
            }
        }

            $.getJSON(navRoot + "/userinfo/data", function (data) {
                if (data && data["code"] == 200) {
                    userInfo = data["data"];
                    if (userInfo["userFlag"] == 2) {
                        $.modal({

        // 获取短信验证码
        function getMessageCodeFun(event) {
            event.preventDefault();
            $this = $(event.currentTarget);
            if ($this[0].hasAttribute("disabled")) {
                return;
            }
            var phone_no = $("#phone_no").val();
            var verify_code = $("#verifycode").val();
            if (/^1[0-9]{10}$/.test(phone_no)) {
                $.post(navRoot + "/sendSMS", {phone_no: phone_no, func_type: 'login', verify_code:verify_code}, function (data) {
                    if (data["code"] != 200) {
                        $.toast(data.errmsg, "text");
                    } else {
                        util.hsTime(".weui-vcode");
                    }
                }, "json");
            } else {
                $.toast("手机格式不正确", "text");
                this[0].removeAttribute('disabled').removeAttr('disabled');
            }
        }

                        if (n) _wait = n;
                        if ('function' === typeof _c.countHander) {
